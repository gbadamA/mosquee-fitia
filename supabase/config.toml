project_id = "mosquee-fitia"

# Ports en 5413x : Windows réserve dynamiquement 54287-54386 (Hyper-V/WSL), ce qui bloque
# les ports Supabase par défaut (5432x). 5412x est déjà pris par le projet asso-jeunes,
# donc ce projet prend la plage suivante — les deux stacks peuvent tourner en parallèle.
[api]
enabled = true
port = 54131
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54132
major_version = 15

[studio]
enabled = true
port = 54133

# `[inbucket]` est déprécié dans les CLI récentes → `[local_smtp]`.
[local_smtp]
port = 54134

[analytics]
enabled = true
port = 54137

[auth]
enabled = true
# Le dashboard tourne sur 3030 (3000 est occupé par d'autres projets du poste).
site_url = "http://localhost:3031"
additional_redirect_urls = ["http://localhost:3031"]

[auth.email]
enable_signup = true
# En local : pas de confirmation, on teste vite. En prod : true.
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

# ⛔ AUCUN FOURNISSEUR SMS — et c'est délibéré.
#
# Mesuré le 2026-08-18 : Supabase n'ouvre la connexion par téléphone que si un
# fournisseur SMS est DÉCLARÉ. Sans lui, `signInWithPassword({phone})` répond
# « Phone logins are disabled » — même sans jamais envoyer le moindre SMS.
#
# Plutôt que de déclarer un Twilio factice, les fidèles s'authentifient par un
# IDENTIFIANT INTERNE dérivé de leur numéro (`2250700000000@fitia.invalid`,
# helper `phoneToAuthEmail` dans `packages/shared/src/profile.ts`). Ils saisissent
# toujours leur numéro à l'écran ; le vrai numéro vit dans `profiles.phone`.
#
# ⚠️ Cette stack locale reflète donc EXACTEMENT la production : pas de canal SMS.
# Ne pas réactiver le bloc Twilio « pour que ça marche en local » — ce serait
# masquer la contrainte de production et faire croire à tort que tout va bien.
# Le canal téléphone ne se rouvrira que le jour d'une vraie souscription SMS.

[realtime]
enabled = true

[storage]
enabled = true
